<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Ícone do app Caocorde: quadrado arredondado laranja com a cabeça-controle em duas "skins":
       metade gato (branco, como no ícone antigo) e metade cachorra (preta, orelha caída). Feito para ficar
       legível até em 16 px (barra de tarefas): poucas formas e contraste forte. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF9A45"/>
      <stop offset="0.75" stop-color="#F07A1E"/>
    </linearGradient>
    <clipPath id="esquerda"><rect width="128" height="256"/></clipPath>
    <path id="cabeca" d="M58 70 C92 58 164 58 198 70 C226 80 242 122 246 170 C249 208 230 228 208 220
           C194 215 184 198 174 186 C158 177 98 177 82 186 C72 198 62 215 48 220
           C26 228 7 208 10 170 C14 122 30 80 58 70 Z"/>
    <clipPath id="direita"><rect x="128" width="128" height="256"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="66" fill="url(#fundo)"/>
  <g transform="translate(28 30) scale(0.78)">
    <path d="M56 96 L64 30 Q66 21 75 27 L120 70 Z" fill="#FFFFFF"/>
    <path d="M70 80 L74 44 L102 70 Z" fill="#FFD9C7"/>
    <use href="#cabeca" fill="#FFFFFF" clip-path="url(#esquerda)"/>
    <use href="#cabeca" fill="#1E1E23" clip-path="url(#direita)"/>
    <path d="M138 68 C158 38 210 26 234 46 C252 62 252 108 238 132 C232 142 220 140 216 130 C208 106 190 86 160 76 Z" fill="#111114"/>
    <!-- olhos -->
    <path d="M68 118 Q90 100 112 118 Q90 132 68 118 Z" fill="#14808C"/>
    <ellipse cx="90" cy="118" rx="3.5" ry="10" fill="#111114"/>
    <circle cx="168" cy="118" r="12" fill="#FFFFFF"/>
    <circle cx="170" cy="119" r="7" fill="#111114"/>
    <!-- nariz -->
    <path d="M112 150 Q128 140 144 150 Q136 164 128 166 Q120 164 112 150 Z" fill="#F07A1E"/>
    <!-- direcional e botões -->
    <g fill="#F07A1E">
      <rect x="42" y="152" width="34" height="11" rx="3"/>
      <rect x="53.5" y="140.5" width="11" height="34" rx="3"/>
      <circle cx="208" cy="142" r="7"/><circle cx="193" cy="157" r="7"/>
      <circle cx="223" cy="157" r="7"/><circle cx="208" cy="172" r="7"/>
    </g>
  </g>
</svg>
